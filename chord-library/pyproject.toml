[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chordlib"
version = "0.1.0"
description = "Comprehensive guitar chord voicing library with algorithmic generation"
requires-python = ">=3.11"

[project.scripts]
chord = "chord_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
