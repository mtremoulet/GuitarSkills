and crisp, and Nigel Hall's vocal is pure soul. The guitar work (primarily Cody Blackbird in the Ghost-Note live setup) is aggressive and rhythmically tight — less lyricism, more percussion. This is where funk guitar lead arrives in the present: it has reabsorbed the historical vocabulary, filtered it through contemporary production, and arrived at something that is recognizably connected to \"Cissy Strut\" and \"Maggot Brain\" while sounding completely contemporary.</p>\n<hr />\n<h2>What to Listen For Across the Whole Arc</h2>\n<ul>\n<li>\n<p><strong>The wah pedal as vowel generator.</strong> Track how the wah transitions from a stylistic choice in 1969 (Nocentelli barely uses it) to a primary articulation tool (Mayfield, Isley, Hazel) to a taken-for-granted color (Scofield's gritty tone, modern envelope filters). The effect is the same across six decades; only the subtlety of its application changes.</p>\n</li>\n<li>\n<p><strong>The silence between phrases.</strong> Every guitarist in this playlist uses rests as structural elements, not empty space. Try counting the beats of silence between Hazel's phrases in \"Maggot Brain\" — they're as carefully placed as the notes. When you reach the modern tracks, notice that the same logic applies: Tom Misch's patience, Mark Lettieri's economy.</p>\n</li>\n<li>\n<p><strong>The arc from maximalism to economy.</strong> The playlist moves from Hazel's ten-minute psychedelic solo toward Carlton's twelve-note statement on \"Street Life.\" This is not a decline; it's the tradition learning to say more with less. Prince synthesizes both extremes — maximalism when needed, restraint when called for.</p>\n</li>\n<li>\n<p><strong>Call-and-response geography.</strong> Listen for how each guitarist positions their phrases relative to the other instruments. In the early tracks, the guitar responds to the horn section. By the middle of the playlist, the guitar <em>is</em> the horn section. By the modern tracks (Snarky Puppy, Ghost-Note), the guitar is part of a conversation that involves keyboard, percussion, and production elements simultaneously.</p>\n</li>\n<li>\n<p><strong>Vibrato as vocabulary.</strong> Wide, slow vibrato (Hazel, Ernie Isley, Prince) signals emotional intensity and is drawn from the blues and gospel traditions. Narrow, quick vibrato (Benson, Ritenour, Scofield) signals jazz refinement. Nai Palm uses almost no vibrato — her expressiveness comes from harmonic choice instead. The vibrato an artist chooses tells you exactly where they're coming from.</p>\n</li>\n</ul>"}];

function showIndex() {
    document.getElementById('index-view').style.display = 'block';
    document.getElementById('detail-view').style.display = 'none';
    document.title = 'Guitar Playlist Library';
}

function showDetail(id) {
    const p = playlists.find(x => x.id === id);
    if (!p) return;
    document.getElementById('index-view').style.display = 'none';
    const dv = document.getElementById('detail-view');
    dv.style.display = 'block';

    const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    const tagPills = tags.map(t => `<span class="pill">${t}</span>`).join('');
    const spotifyBtn = p.spotify_url
        ? `<a class="spotify-btn" href="${p.spotify_url}" target="_blank">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
               <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
             </svg>
             Open in Spotify
           </a>`
        : '';

    dv.innerHTML = `
        <button class="back-btn" onclick="showIndex()">← All Playlists</button>
        <div class="detail-meta">${tagPills}</div>
        ${spotifyBtn}
        <div id="detail-body">${p.html_body}</div>
    `;
    document.title = p.title || 'Playlist';
    window.scrollTo(0, 0);
}

function renderIndex() {
    const grid = document.getElementById('playlist-grid');
    grid.innerHTML = playlists.map(p => {
        const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 4);
        const tagPills = tags.map(t => `<span class="pill">${t}</span>`).join('');
        return `
        <div class="card" onclick="showDetail('${p.id}')">
            <div class="card-title">${p.title || p.id}</div>
            <div class="card-angle">${p.angle || ''}</div>
            <div class="card-meta">${tagPills}<span class="pill green">${p.track_count || '?'} tracks</span></div>
            <div class="card-artists">${p.featured_artists || ''}</div>
            <div class="card-date">${p.created || ''}</div>
        </div>`;
    }).join('');
}

renderIndex();
</script>
