ony makes his phrase construction completely audible.</p>\n<p><strong>8. James — Pat Metheny Group</strong> <em>(Offramp, 1982)</em></p>\n<p>D Dorian from first note to last — a pure modal vamp. D Dorian is D–E–F–G–A–B–C: the D natural minor scale with a raised 6th (B natural instead of Bb), giving it a slightly brighter, more hopeful feel than pure minor. The harmony barely moves: it's mostly a Dm7 tonic with occasional G7 pulls (the IV chord in Dorian). What this track teaches is how to hear <em>color</em> without changes: Metheny navigates the modal space by choosing which notes to emphasize above the Dm7, creating tension and release purely through melodic choice rather than harmonic motion. From your violin/fiddle background — this is modal improvisation, the same principle as playing in D Dorian on a tune with a drone.</p>\n<p><strong>9. Nocturne — Julian Lage</strong> <em>(Arclight, 2016)</em></p>\n<p>A short (3:19) quiet ballad built on a simple repeating minor progression — roughly Am–G–F–E, or a i–VII–VI–V rotation in A minor. Lage's guitar is completely exposed, playing a gentle arpeggiated figure that doubles as both melody and harmony. This is one of the best tracks on the list for noticing how a guitarist implies chord changes <em>without</em> a bass or piano: every harmonic move is in the guitar's voicings and the melody notes he chooses. Perfect for identifying chord changes by ear, because the guitar has to do all the work.</p>\n<p><strong>10. Last Train Home — Gilad Hekselman</strong> <em>(Homes, 2015)</em></p>\n<p>A modern groover built on a repeating minor vamp — think of it as a jazz version of a funk ostinato. Hekselman's guitar sits front and center, and the form is short enough to feel like a loop. Israeli-born, NYC-based, Hekselman has one of the most lyrical guitar voices in contemporary jazz: he phrases like a singer, with long arching lines that peak and resolve over two to four bars. Notice how he controls <em>where in the bar</em> he starts a phrase — often picking up from the \"and\" of beat four, which gives everything a slightly floating, late feel. That rhythmic placement is one of the most characteristic things about modern jazz phrasing.</p>\n<hr />\n<h3>Part 3: Short Standards, Modern Players</h3>\n<p><strong>11. Autumn Leaves — Julian Lage Group</strong> <em>(Gladwell, 2009)</em></p>\n<p>The most learnable standard progression in jazz: a descending ii–V–I chain that moves from Bb major to G minor over eight bars, then loops. The chord sequence is Cm7–F7–Bbmaj7–Ebmaj7–Am7b5–D7–Gm (II–V–I in Bb major, then ii–V–i in G minor). You can see the parallel motion — each ii–V–I just drops a fourth from the last. Lage plays it straight but with great rhythmic clarity. Count the eight-bar A section repeatedly until you can <em>feel</em> where Cm7 comes in without counting. That's the goal with any standard: internalize the form, not just understand it.</p>\n<p><strong>12. Darn That Dream — Lage Lund</strong> <em>(Standards, 2007)</em></p>\n<p>Lage Lund is one of the most lyrical modern mainstream guitarists — this Norwegian-American guitarist won the Monk Competition in 2005 and has a sound somewhere between Jim Hall's restraint and Kurt Rosenwinkel's harmonic curiosity. \"Darn That Dream\" is a 32-bar AABA ballad with changes that move through I–VI–II–V in C major. The tempo is slow enough that you can follow every harmonic move in real time. This is a masterclass in ballad phrasing: long, melodic statements with space between them, each phrase ending on a chord tone that lets the harmony ring.</p>\n<p><strong>13. I'll Be Seeing You — Jonathan Kreisberg</strong> <em>(Night Songs, 2009)</em></p>\n<p>An ABAC 32-bar standard — slightly different from AABA in that the last eight bars contrast with both the A and B sections, giving it a more open-ended feeling. The changes are simple (F major, ii–V–I gestures, a few secondary dominants), and Kreisberg's playing is luminous and unhurried. Kreisberg is one of the finest harmonic thinkers in contemporary jazz guitar, but \"Night Songs\" is his most accessible album — the romanticism of the material pulls him toward melody over complexity. Listen for how he uses silence: the rests in his phrases are as informative as the notes.</p>\n<p><strong>14. Blue in Green — Jonathan Kreisberg</strong> <em>(Night Songs, 2009)</em></p>\n<p>The Bill Evans/Miles Davis composition from \"Kind of Blue\" — a ten-bar form built primarily on minor chord areas that cycle with a slightly suspended quality (Gm–C7–Bbmaj7–A7sus4–Dm–Dbmaj7–Cm7–F7–Bbmaj7–A7b9). It's not a blues, despite the name; it's a through-composed form that doesn't resolve strongly, creating a floating, introspective character. Kreisberg's version is stripped down and beautiful. For ear training: notice that almost every chord is a minor seventh or dominant seventh — there are no major chords fighting for attention. This teaches you to hear the difference between minor color and dominant color as chord qualities.</p>\n<p><strong>15. Four (Live) — Peter Bernstein</strong> <em>(Live at Smalls, 2010)</em></p>\n<p>Miles Davis's \"Four\" is a 32-bar AABA hard bop vehicle — medium-up swing tempo, clearly defined ii–V–I changes in Eb major with a short bridge that moves to the IV (Ab major). Bernstein is one of the most harmonically grounded guitarists in hard bop: his lines are bebop-fluent but always swinging, never scholastic. The live recording at Smalls means you get the raw, unvarnished version — no studio gloss. Track the A section (eight bars): Ebmaj7 for two bars, then ii–V (Fm7–Bb7) for two bars, back to Ebmaj7 for two bars, then a ii–V–I resolution. It's a repeating blueprint. This is your hard bop AABA model.</p>\n<p><strong>16. There Will Never Be Another You — Pasquale Grasso</strong> <em>(Solo Standards, 2020)</em></p>\n<p>Pasquale Grasso plays solo unaccompanied guitar — no bass, no drums, no piano. Everything you hear is his guitar: melody, harmony, rhythm, bass line. \"There Will Never Be Another You\" is an AABA standard in Eb major with clean ii–V–I progressions that Grasso spells out completely in his chord-melody playing. This is the ultimate ear-training track for standard form: because there's no rhythm section to lean on, every chord change <em>has</em> to be articulated by the guitarist. Listen for how he walks bass notes on beats 1 and 3 while playing melody on top — that's the traditional chord-melody technique that comes directly from classical counterpoint, which you'll recognize from your musical background.</p>\n<p><strong>17. Conception I — Kurt Rosenwinkel</strong> <em>(Intuit, 1999)</em></p>\n<p>\"Conception\" is a rhythm changes head — built on the same 32-bar AABA harmonic skeleton as \"I Got Rhythm\" (Gershwin), the most recycled form in jazz. The A section is essentially I–VI–II–V repeating every two bars: Bb–G7–Cm7–F7, cycling around the circle of fifths. The bridge is eight bars of dominant chords descending by fourths: D7–G7–C7–F7. Once you know rhythm changes, you know the harmonic architecture of hundreds of bebop tunes. Rosenwinkel plays it at a loose trio medium swing. Notice how the harmony moves every two beats in the A section — that rapid chord rhythm is characteristic of bebop and is what makes rhythm changes feel so propulsive.</p>\n<hr />\n<h3>Part 4: Modern Guitar-Forward Originals</h3>\n<p><strong>18. Word for Word — Julian Lage</strong> <em>(View With a Room, 2022)</em></p>\n<p>A minor-key original built on a simple descending progression — Am–G–F–E type motion, but developed over a tight trio. Lage's guitar is right in your ear: clean, present, every note audible. Notice how he develops a short melodic motif at the top of each chorus and then varies it through each pass of the form. This is the most efficient way to understand jazz improvisation — as theme and variation, not as \"playing scales over chords.\" The form is short enough that you can count the choruses and notice exactly where he is in the structure at any point.</p>\n<p><strong>19. Squint — Julian Lage</strong> <em>(Squint, 2021)</em></p>\n<p>Medium swing original on a short AABA form. \"Squint\" showcases Lage's complete command of the bebop vocabulary as filtered through his own voice — the phrases are built from bebop cells but assembled with a folk-like directness. At this tempo you can clearly hear the ii–V–I motion that drives the A section. It's a track for understanding how modern guitarists inherit bebop vocabulary without just playing bebop: the swinging eighth notes are there, the chromatic approaches are there, but the phrasing shape is uniquely contemporary.</p>\n<p><strong>20. Flower — Gilad Hekselman</strong> <em>(Hearts Wide Open, 2011)</em></p>\n<p>A short, lyrical original on a straightforward AABA structure. Mark Turner's saxophone and Hekselman's guitar intertwine in a way that makes the guitar's harmonic role very clear: he's both voicing chords and playing melodic fills simultaneously. The tempo is gentle, the changes move slowly, and the guitar tone is warm and direct. A good track for hearing how a modern guitar comps in a conversation with a horn — it's not strumming full chords on every beat, it's punctuation, response, and texture.</p>\n<p><strong>21. Lover — Nir Felder</strong> <em>(Golden Age, 2014)</em></p>\n<p>Rodgers &amp; Hart's \"Lover\" is an AABA 32-bar waltz in 3/4 time — the most guitaristically interesting meter because it's uneven in a way that throws off automatic strumming patterns. Felder plays it with a modern electric guitar sound and a loose trio feel, keeping the form completely legible while adding contemporary harmonic color. The 3/4 meter means the ii–V–I resolutions feel different rhythmically than in 4/4 — more spacious, more circular. From your broad rhythmic background, you'll find the waltz form very singable once you've heard it twice.</p>\n<p><strong>22. Since You Asked — John Scofield</strong> <em>(Time on My Hands, 1990)</em></p>\n<p>Scofield's playing sits at the intersection of jazz, blues, and rock — his guitar voice is immediately recognizable: slightly distorted, extremely funky in the phrase rhythms. \"Since You Asked\" is a medium blues-influenced groove with a simple form. Sco's rhythmic vocabulary is one of the most teachable in jazz guitar: he plays \"behind the beat\" in a very deliberate way, letting each phrase arrive just slightly late, which creates a looser, more conversational feel than the \"on top of the beat\" approach of bebop. Notice how his phrases feel like they're always <em>finishing</em> rather than <em>starting</em>.</p>\n<p><strong>23. Have a Little Faith in Me — Bill Frisell</strong> <em>(Have a Little Faith, 1992)</em></p>\n<p>A John Hiatt country-soul song rendered as a simple jazz guitar meditation. Frisell's guitar is completely alone at the center of the mix — the harmony is just I–IV–V in a major key, about as simple as harmony gets. The point of ending with this track is to hear what a master guitarist does with the <em>simplest possible harmonic material</em>: Frisell's tone, his vibrato, his choice of when to add a note versus sit in silence, his gentle rubato around the melody — all of this is pure guitar artistry applied to something a beginner could play the chords to. Simplicity is a destination, not a starting point.</p>\n<hr />\n<h2>What to Listen For Across the Whole Arc</h2>\n<ul>\n<li>\n<p><strong>The IV chord moment in the blues</strong>: In every 12-bar track, bar 5 is where the harmony shifts from I7 to IV7. Before you can hear anything else clearly, train your ear to anticipate that moment. It has a brightening, opening quality — like moving from tonic ground to a brief harmonic exhale.</p>\n</li>\n<li>\n<p><strong>Phrase endings on chord tones</strong>: The great guitarists on this list almost always end their phrases on a note that belongs to the chord underneath. Listen for which note a phrase lands on — root, 3rd, 5th, or 7th — and how that landing note determines whether the phrase feels finished or suspended.</p>\n</li>\n<li>\n<p><strong>How guitar replaces the piano</strong>: In piano-less trios (Green's \"Idle Moments,\" Grasso's solo pieces, several of the Lage tracks), the guitarist has to do everything: melody, harmony, bass implied. Notice how their left hand voicings carry the harmonic information that a pianist would handle, and how that changes what the melodic lines do.</p>\n</li>\n<li>\n<p><strong>Rhythmic placement — where in the beat phrases start</strong>: Modern jazz guitarists (Lage, Hekselman, Kreisberg) almost never start phrases exactly on beat 1. They typically begin on the \"and\" of 4, or the \"and\" of 2. That rhythmic offset creates the swinging, conversational quality that distinguishes jazz phrasing from classical phrasing. Compare to Metheny's \"James\" — his phrases are longer and more metrically regular, which is part of why that track sounds more lyrical and less \"inside\" the swing.</p>\n</li>\n<li>\n<p><strong>The turnaround</strong>: In both blues and AABA standards, the last two bars of each chorus contain a \"turnaround\" — a ii–V (or I–VI–ii–V) that cycles back to the top. Listen for when the harmony gets busier or more chromatic in bar 11–12 of a blues, or bar 7–8 of an A section. That's the turnaround. Once you can hear it, you can feel the form breathing.</p>\n</li>\n</ul>"}, {"id": "bebop-guitar-vocabulary-primer", "title": "Bebop Guitar — A Vocabulary Primer", "angle": "Guitar's journey through bebop: how guitarists translated a horn-born language onto a polyphonic instrument, from Charlie Christian through Pat Martino", "tags": "bebop, hard-bop, jazz, vocabulary, history, single-note, chromatic", "featured_artists": "Charlie Christian, Tal Farlow, Jimmy Raney, Barney Kessel, Herb Ellis, Jim Hall, Wes Montgomery, Kenny Burrell, Grant Green, Joe Pass, Pat Martino, George Benson", "track_count": "23", "spotify_url": "https://open.spotify.com/playlist/4o2sDzsFphAntzrK3vjB1Z", "created": "2026-05-16", "html_body": "<h1>Bebop Guitar — A Vocabulary Primer</h1>\n<p><strong>Spotify Playlist:</strong> <a href=\"https://open.spotify.com/playlist/4o2sDzsFphAntzrK3vjB1Z\">Bebop Guitar — A Vocabulary Primer</a>\n<strong>23 tracks · ~5 hours</strong></p>\n<hr />\n<h2>What Bebop Actually Is (And Why Guitar Had It Hard)</h2>\n<p>You already know swing. Big bands, written arrangements, soloists who improvised within a fairly diatonic framework over chord changes that didn't move too fast. Bebop — born roughly 1942–1947 in New York, primarily at Minton's Playhouse in Harlem — was a direct rebellion against all of that.</p>\n<p>The core bebop innovations, in terms you'll recognize from your theory background:</p>\n<p><strong>1. Harmonic density.</strong> Bebop chord changes move fast — often every two beats — and make heavy use of ii–V–I chains in rapid modulation. A bebop head might cycle through five or six keys in eight bars. The extensions went deep: 9ths, ♭9ths, ♯9ths, ♯11ths, ♭13ths are not ornamental, they're structural.</p>\n<p><strong>2. Tritone substitution.</strong> The most important single bebop harmonic concept. Any dominant 7th chord can be replaced by the dominant 7th chord a tritone away (sharing the same guide tones — just inverted). A G7 becomes D♭7. This creates chromatic bass motion and allows for lines that seem to \"float\" over the changes in ways that sound wrong and then resolve.</p>\n<p><strong>3. Chromatic approach tones.</strong> Bebop lines approach chord tones from a half-step below or above. Not as decoration — as a fundamental grammatical unit. The \"bebop scale\" (major scale with a passing tone between ♭7 and natural 7, or between 5 and ♭5 depending on the scale) exists precisely to keep these approach tones landing on the beat.</p>\n<p><strong>4. Irregular phrasing.</strong> Swing phrases tend to resolve on downbeats and breathe in predictable places. Bebop phrases deliberately land <em>off</em> the beat, start in the middle of bars, and end unresolved — requiring the next phrase to answer. This creates the \"continuous motion\" effect that sounds like one long sentence rather than call-and-response.</p>\n<p><strong>5. Fast tempos as a filter.</strong> Early beboppers played fast <em>intentionally</em> to exclude commercial musicians who couldn't keep up. But the vocabulary works at any tempo — bebop at a ballad pace (Bill Evans, Jimmy Raney) sounds just as harmonically sophisticated.</p>\n<h3>Why Guitar Had It Hard</h3>\n<p>Bebop was developed almost entirely by horn players — Charlie Parker (alto sax), Dizzy Gillespie (trumpet), Bud Powell (piano), and their circles. The vocabulary translates naturally to a monophonic instrument: single lines, one note at a time, moving through changes at speed.</p>\n<p>Guitar is polyphonic. It's built for chords. Its natural registers overlap in ways that make pure melodic lines muddier than on a horn. Fretboard geometry means that fast bebop lines require position shifts that a saxophone player never has to think about. And the guitar's dynamic response doesn't have the sharp transient attack of a trumpet — fast runs can blur into each other.</p>\n<p>The guitarists in this playlist each solved this problem differently. That's what makes listening across the arc so useful: you're not just hearing jazz, you're hearing multiple distinct answers to the same question.</p>\n<hr />\n<h2>The Playlist: Perspective and Arc</h2>\n<p>This list is structured as a listening curriculum, roughly chronological by era. It starts at the moment bebop was being invented and ends in the early 1970s, when the vocabulary had been fully absorbed and guitarists were beginning to push beyond it.</p>\n<p>The point of view is <strong>the guitarist as translator</strong> — someone taking a language developed on horns and learning to speak it on an instrument that requires constant adaptation. Every track was chosen to illustrate something specific about how that translation was happening.</p>\n<hr />\n<h2>Track-by-Track Commentary</h2>\n<h3>Era I: The Origin — Charlie Christian (1939–1941)</h3>\n<p><strong>1. Air Mail Special — Charlie Christian</strong> <em>(The Genius of the Electric Guitar)</em></p>\n<p>Christian died of tuberculosis in 1942 at 25, but he invented the template that every subsequent jazz guitarist would work from. Before Christian, guitar in jazz was a rhythm instrument — strummed chords, keeping time. Christian picked up the electric guitar and started playing single-note horn lines, and the whole instrument changed function. \"Air Mail Special\" is full-speed swing, but listen to how Christian phrases: long, flowing lines that breathe in irregular places, approach tones landing right before the chord tone. The bebop grammar is already half-formed here, even if the tempo and harmony are still swing.</p>\n<p><strong>2. Seven Come Eleven — Benny Goodman Sextet feat. Charlie Christian</strong> <em>(The Original Guitar Hero)</em></p>\n<p>More relaxed than \"Air Mail Special\" and therefore easier to follow the voice. Notice the melodic contour — Christian doesn't just run scales, he shapes phrases that peak and resolve like a great vocal melody. This is what bebop improvisation sounds like before it got fully fast and angular. The chord behind him is still swing-era, but his lines are pointing forward.</p>\n<hr />\n<h3>Era II: Pure Bebop Guitar — Tal Farlow &amp; Jimmy Raney (late 1940s–1950s)</h3>\n<p>These two are the guitarists who actually absorbed what Parker and Gillespie were doing and translated it directly. Both came up in the late 1940s when bebop was the active frontier, not a style to emulate.</p>\n<p><strong>3. Yardbird Suite — Tal Farlow</strong> <em>(The Swinging Guitar of Tal Farlow)</em></p>\n<p>\"Yardbird Suite\" is a Charlie Parker composition — named directly for Bird — and Farlow's version is an explicit statement of intent: <em>I'm playing the bebop language on guitar.</em> Farlow had enormous hands (he was a sign painter by trade before music) and used them to play chord voicings and single-note lines that most guitarists physically can't. The speed here is real bebop speed. Notice that the lines don't sound like guitar lines — they sound like saxophone lines on a guitar, which is precisely the point.</p>\n<p><strong>4. Cherokee — Tal Farlow</strong> <em>(The Artistry of Tal Farlow)</em></p>\n<p>\"Cherokee\" was the crucible piece for beboppers. Its chord changes move through several remote keys and require the player to navigate a harmonic maze at tempo. Charlie Parker's famous composition \"Ko-Ko\" is literally just an improvisation over Cherokee's changes — playing it well at full speed was the bebop entrance exam. Farlow's version shows you what passing that exam looks like on guitar: position shifts happen invisibly, the chromatic approach tones are clear, the phrasing breathes against the bar lines rather than with them.</p>\n<p><strong>5. There Will Never Be Another You — Jimmy Raney</strong> <em>(Pennies from Heaven)</em></p>\n<p>If Farlow was the athlete of bebop guitar, Jimmy Raney was the poet. His lines are softer, more introspective, more harmonically surprising in a lyrical way rather than a virtuosic way. Raney was Miles Davis's favorite guitarist — which tells you everything. Where Farlow impresses you, Raney moves you. \"There Will Never Be Another You\" is a standard with a tricky bridge (it modulates to the parallel major) and Raney navigates it with a fluency that sounds inevitable, not worked out.</p>\n<p><strong>6. Body and Soul — Jimmy Raney</strong> <em>(Pennies from Heaven)</em></p>\n<p>One of the great harmonic tightrope walks in the standard repertoire — \"Body and Soul\" is famous for its modulation to D♭ major in the bridge while the main key is D♭/C♯. Coleman Hawkins' 1939 recording of this tune is one of the birth documents of harmonic jazz improvisation. Raney's version shows how the bebop vocabulary handles a harmonically dense standard: he doesn't avoid the hard changes, he lands on them with chromatic approaches that make the resolution feel both surprising and inevitable.</p>\n<hr />\n<h3>Era III: The Cool and West Coast Wing — Kessel, Ellis, Hall (1950s–1960s)</h3>\n<p>Bebop's West Coast translation softened some of the NY intensity and added more compositional thinking. These guitarists worked in smaller groups and drew on the chamber music aesthetic of the Cool era.</p>\n<p><strong>7. Easy Like — Barney Kessel</strong> <em>(Easy Like, Vol. 1)</em></p>\n<p>Kessel is the most bluesy of the bebop guitarists — he grew up in Muskogee, Oklahoma, and never entirely left the blues behind. \"Easy Like\" is bebop vocabulary deployed with a relaxed, grooving feel that the pure New York boppers sometimes sacrificed for speed. Notice how Kessel's lines have a more vocal, bending quality than Farlow's or Raney's — the blues inflection doesn't break the bebop grammar, it enriches it. This is what \"hard bop before hard bop\" sounds like.</p>\n<p><strong>8. How High the Moon — Herb Ellis with Oscar Peterson</strong> <em>(Vancouver, 1958)</em></p>\n<p>\"How High the Moon\" was a standard bebop vehicle — its changes are a classic II–V–I workout. Ellis played in the Oscar Peterson Trio for years, and the interaction here is electrifying: Peterson is one of the most technically demanding jazz pianists who ever lived, and Ellis matches him. This track is also a lesson in <em>comping behind a virtuoso</em> — watch how Ellis fills space without stepping on Peterson and then steps out with full confidence when it's his turn.</p>\n<p><strong>9. All Across the City — Bill Evans &amp; Jim Hall</strong> <em>(Intermodulation)</em></p>\n<p>This is the most harmonically advanced track in the playlist and requires a different kind of listening. Hall and Evans had one of the great musical partnerships in jazz — two musicians who thought about harmony in similar ways, both deeply influenced by classical voice leading. This isn't bebop in the fast/frenetic sense at all. But it is bebop vocabulary applied with such sophistication that the lines seem to dissolve into the harmony rather than run over it. If Farlow shows you the outside of the vocabulary, Hall and Evans show you the inside.</p>\n<p><strong>10. Concierto de Aranjuez — Jim Hall</strong> <em>(Concierto, CTI Records)</em></p>\n<p>The Rodrigo concerto movement as a jazz performance. Hall's guitar tone here — warm, rounded, no attack — is a statement of aesthetic philosophy: the guitar doesn't need to sound like a horn to play the language. It can sound like itself. This is a long track (nearly 20 minutes) and doesn't need to be heard in one sitting, but the opening guitar statement alone, unaccompanied, is one of the most beautiful things in recorded jazz guitar.</p>\n<hr />\n<h3>Era IV: Hard Bop Guitar — Wes Montgomery, Kenny Burrell, Grant Green (1960s)</h3>\n<p>Hard bop was bebop's evolution in the early 1960s — deeper blues roots, gospel influences, funkier rhythmic feel, more accessibility without sacrificing harmonic sophistication. These three guitarists are its definitive voices on the instrument.</p>\n<p><strong>11. Four on Six — Wes Montgomery</strong> <em>(The Incredible Jazz Guitar of Wes Montgomery, Remastered 2025)</em></p>\n<p>The track that established Wes Montgomery as the dominant figure in jazz guitar. He plays with his thumb (no pick), which creates a warmer, rounder attack — and he plays single lines, then re-harmonizes those same lines in octaves (a signature move), then in block chords. All three approaches use the same bebop vocabulary; the difference is texture and density. \"Four on Six\" is built on a Wes original that opens with an angular, dissonant riff and then flows into swinging improvisation. The opening riff alone has been transcribed and studied by more guitarists than almost anything else in jazz.</p>\n<p><strong>12. West Coast Blues — Wes Montgomery</strong> <em>(The Incredible Jazz Guitar of Wes Montgomery, Remastered 2025)</em></p>\n<p>A 12-bar blues, but with Wes's harmonic sophistication applied. The substitutions he plays over a basic blues form — and makes <em>sound</em> simple — are a graduate-level lesson in bebop harmony. The blues is the deepest well in American music, and bebop guitarists who could drink from both wells simultaneously (not alternating between them) are the ones who matter. This track is those two things fully integrated.</p>\n<p><strong>13. Full House — Wes Montgomery</strong> <em>(Live at Tsubo, 1962)</em></p>\n<p>The live recording that cemented Wes's reputation. The crowd is audible throughout — you can hear them responding to his lines in real time. Full House is a mid-tempo, walking-bass-driven setting where Wes has room to build his improvisations into long, connected narratives. The octave work here is at its peak: he'll play a single-note line that builds tension, then suddenly shift to octaves and the entire room feels it. Listen for how the phrases stack — each one leaving off slightly unresolved so the next one has somewhere to go.</p>\n<p><strong>14. No Blues — Wes Montgomery with Wynton Kelly Trio</strong> <em>(Smokin' at the Half Note)</em></p>\n<p>Live at the Half Note in 1965, with one of the great rhythm sections of the era. \"No Blues\" (a Miles Davis composition) is almost thirteen minutes and shows Wes playing through a full arc: restrained early, building in density, octaves arriving at the peak, then releasing back down. The Wynton Kelly trio — with Paul Chambers on bass and Jimmy Cobb on drums — is the same rhythm section that recorded <em>Kind of Blue</em>. They understand pace and space at a level most rhythm sections don't reach.</p>\n<p><strong>15. Midnight Blue — Kenny Burrell</strong> <em>(Midnight Blue, Rudy Van Gelder Edition)</em></p>\n<p>The title track of Burrell's most celebrated Blue Note record. Slow blues, 12/8 feel, with Ray Barretto on conga — this is as far as you can get from frenetic bebop while still using the same harmonic vocabulary. Burrell's gift is making sophisticated harmony feel like a natural expression of the blues. There are chromatic passing tones, tritone substitutions, and bebop scale fragments all over this track, but they don't announce themselves as devices. They just sound like feeling.</p>\n<p><strong>16. Chitlins Con Carne — Kenny Burrell</strong> <em>(Midnight Blue, Rudy Van Gelder Edition)</em></p>\n<p>A minor blues shuffle that became a jazz guitar standard. More uptempo than \"Midnight Blue\" and more overtly funky. Burrell's single-note lines here are a masterclass in bebop economy — he's not playing everything he knows, he's playing what serves the groove. Notice how the lines lock in rhythmically with the drummer in a way that pure beboppers often didn't prioritize. Hard bop values the body as much as the mind.</p>\n<p><strong>17. Idle Moments — Grant Green</strong> <em>(Idle Moments)</em></p>\n<p>Nearly fifteen minutes — one of the most patient performances in jazz guitar. Grant Green spent years working with organists in soul jazz settings before making this record, and it shows in how he thinks about sustain and space. Where Wes plays phrases in rapid succession, Green lets individual notes breathe. The harmonic vocabulary is still bebop — the lines are built on chord tones with chromatic approaches — but the rhythmic feel is stretched almost to the breaking point. \"Idle Moments\" teaches you what bebop sounds like at maximum relaxation.</p>\n<p><strong>18. My Favorite Things — Grant Green</strong> <em>(Matador)</em></p>\n<p>Coltrane's famous version of this Rodgers &amp; Hammerstein waltz had just redefined what jazz could do with a simple melody when Green recorded his own version. Green's approach strips out Coltrane's modal intensity and replaces it with clean, single-note bebop vocabulary — and the contrast is illuminating. Both are using jazz grammar, but one is painting with wide brushes and one is drawing precise lines. Both are right.</p>\n<hr />\n<h3>Era V: The Post-Bop Virtuosos — Joe Pass, Pat Martino, George Benson (late 1960s–early 1970s)</h3>\n<p>By this point the bebop vocabulary was fully digested, and these guitarists used it as a foundation rather than a frontier. The music became more technically demanding, more personal, and in some ways more extreme.</p>\n<p><strong>19. All the Things You Are — Joe Pass</strong> <em>(Virtuoso, Remastered 2025)</em></p>\n<p>Pass's <em>Virtuoso</em> album (1973) is solo guitar — no bass, no drums, no rhythm section. Just Pass making a complete musical statement on his own. \"All the Things You Are\" is one of the most harmonically complex standards in the repertoire — it cycles through multiple key centers and has been used as a harmonic etude by jazz players for decades. Pass plays the melody, implies the bass line, voices the chords, and improvises over all of it simultaneously. This is the bebop vocabulary at maximum sophistication: not one line through changes, but all the lines at once.</p>\n<p><strong>20. Cherokee — Joe Pass</strong> <em>(Virtuoso, Remastered 2025)</em></p>\n<p>Back to the bebop entrance exam, but decades later. Compare this to Tal Farlow's version earlier in the playlist. Both are virtuosic; the difference is what the vocabulary means to each player. For Farlow, it was a new language being learned in real time. For Pass, it's a native tongue — he's not translating bebop onto guitar, he's thinking in it. The harmonic density Pass achieves in the solo guitar format on this change-heavy tune is genuinely hard to explain: he is the bass player, the comping pianist, and the soloist, all in the same moment.</p>\n<p><strong>21. The Visit — Pat Martino</strong> <em>(Footprints)</em></p>\n<p>Martino is the most intense of the bebop guitarists — his lines have a relentless, almost aggressive forward motion that doesn't release until the phrase is complete. His theoretical approach was unusually systematic (he mapped the entire fretboard as a set of diminished and augmented relationships), and that geometry gives his playing a distinctive angular quality. \"The Visit\" shows Martino at his most fluent: fast, clean, harmonically accurate, with a rhythmic grip that locks into the pocket even when the lines are most complex.</p>\n<p><strong>22. Sunny — Pat Martino</strong> <em>(Givin' Away the Store)</em></p>\n<p>A pop song from 1966, completely reinterpreted as a bebop vehicle. This version runs over ten minutes and follows the full bebop approach: melody stated, then abandoned in favor of extended improvisation that uses the changes as a scaffold for something much more harmonically adventurous. By the late chorus, Martino's lines have traveled so far from the melody that you need the rhythm section to remember what song you're in.</p>\n<p><strong>23. Giblet Gravy — George Benson</strong> <em>(Giblet Gravy, Expanded Edition)</em></p>\n<p>Benson before pop stardom — this is his 1967 CTI recording where he was still a straight-ahead jazz guitarist of the first rank. \"Giblet Gravy\" is a funky, swinging original that sounds like the intersection of hard bop and the emerging soul jazz scene. Benson's tone is warmer and more polished than Martino's or Green's, and his lines have a melodic clarity that would later serve him well in more commercial settings — but here it's deployed in a fully jazz context. This track closes the playlist as a bridge: looking backward at the bebop vocabulary, looking forward at where jazz guitar would go next.</p>\n<hr />\n<h2>What to Listen For Across the Whole Arc</h2>\n<p><strong>The translation problem.</strong> Every guitarist here is solving the same puzzle: how do you play horn lines on a polyphonic instrument without losing either the harmonic sophistication of the original vocabulary or the unique capabilities of the guitar? No two of them solve it the same way.</p>\n<p><strong>Chromatic approach tones.</strong> In any track, try to identify when a note sounds like it \"shouldn't\" be there for a beat — then resolves to the chord tone. That's a bebop approach. You'll start hearing them everywhere.</p>\n<p><strong>Phrase placement.</strong> Bebop phrases deliberately start and end in unexpected places relative to the bar line. This is what creates the forward momentum. As you listen, try to notice when a phrase ends in the middle of bar 2 — and when the next phrase starts on the \"and\" of beat 3. This rhythmic displacement is not accidental.</p>\n<p><strong>The role of the rhythm section.</strong> Bass and drums in bebop are active participants, not timekeepers. Listen to how the drummer responds to a guitar phrase — the ride cymbal pattern, the snare accents, the kick drum. Jazz improvisation is a conversation, and the vocabulary is shared.</p>\n<p><strong>Octaves, single notes, chords.</strong> Wes Montgomery's three-level approach is the most systematic version of this, but all the guitarists here move between these textures. Each texture has different harmonic implications and different weight in the musical moment.</p>"}, {"id": "funk-lead-guitar-melodic-voice", "title": "Funk Lead Guitar — The Melodic Voice", "angle": "Funk guitar as a soloing tradition: tracing the lineage of guitar-as-lead-singer from psychedelic soul roots through Prince's synthesis to the modern renaissance.", "tags": "funk, lead guitar, soul, R&B, psychedelic, jazz-funk, neo-soul, wah pedal, envelope filter, modern funk", "featured_artists": "Eddie Hazel, Ernie Isley, Curtis Mayfield, Shuggie Otis, George Benson, Lee Ritenour, Prince, John Scofield, D'Angelo, Hiatus Kaiyote, Snarky Puppy, Tom Misch, Lettuce, Ghost-Note", "track_count": "23", "spotify_url": "https://open.spotify.com/playlist/1vh0Lq3ESHKhBVUZ6kVj5D", "created": "2026-05-16", "html_body": "<h1>Funk Lead Guitar — The Melodic Voice</h1>\n<p><strong>Spotify Playlist:</strong> <a href=\"https://open.spotify.com/playlist/1vh0Lq3ESHKhBVUZ6kVj5D\">Funk Lead Guitar — The Melodic Voice</a>\n<strong>23 tracks · ~2 hr 13 min</strong></p>\n<hr />\n<h2>What Funk Lead Guitar Actually Is</h2>\n<p>Most discussion of funk guitar fixates on rhythm: the chopped sixteenth-note chords, the muted percussive scratches, the locked-in-with-the-drums thing Nile Rodgers perfected. That's for another playlist. This one is about the other tradition — the guitarist as soloist, melodist, and emotional storyteller within a funk context. It is a smaller, stranger lineage, and it is arguably the more expressive one.</p>\n<p>The defining mechanic is voice imitation. Where a jazz guitarist might model their phrasing on bebop horn lines, the funk lead guitarist models their phrasing on the human voice — specifically on the Southern soul vocal tradition. Curtis Mayfield's guitar sounds like his own falsetto; Ernie Isley's wah-drenched leads are essentially horn-section fills with strings attached. The wah pedal is the primary tool because it mimics the vowel-shift of the human voice: rocking it forward is opening the mouth, pulling back closes it. When you hear a guitarist \"talk\" through a wah, they are literally singing through the instrument. As a saxophonist, you already know what it feels like when a phrase <em>breathes</em> — funk lead guitar is that same logic, just through a transducer instead of a reed.</p>\n<p>The rhythmic placement is what separates funk lead from blues or rock lead. A blues guitarist bends into the beat; a funk guitarist bends <em>around</em> the beat. Phrases start on upbeats and resolve on unexpected downbeats, or they start on downbeats and end mid-bar in a way that creates forward momentum. The rest — the silence between phrases — is as load-bearing as the notes. This is the same economy you'd apply as a horn player: you don't hold a note because you can; you hold it because the phrase demands it, and then you stop. Funkiness lives in the stopping.</p>\n<p>Harmonically, funk lead guitar is surprisingly lean. The core vocabulary is the minor pentatonic scale (your five-note blues box), extended with the flat five (the blue note) and occasional Dorian-mode passing tones. The sophistication comes entirely from <em>where</em> in the bar you place those notes and <em>how</em> you articulate them — with the wah, with the envelope filter, with a hard attack or a lazy pull-off. The melodic language is closer to a trumpet player's ethos than a classical violinist's: motifs, repetition with variation, call-and-response. If you've arranged an a cappella chart where the baritone line punches between bass and tenor phrases, you already understand the spatial logic of funk guitar lead playing.</p>\n<hr />\n<h2>The Playlist: Perspective and Arc</h2>\n<p>This playlist follows the melodic-lead tradition from its psychedelic-soul origins in 1969 through five distinct phases: the Hendrix-inflected psychedelic funk of Funkadelic and the Isleys; the jazz-funk refinement of the mid-to-late '70s; Prince's synthesis of everything into something entirely personal; the neo-soul bridge of the late '90s and early 2000s; and the contemporary renaissance, where players like Nai Palm, Mark Lettieri, and Tom Misch are writing new chapters. The emphasis throughout is on tracks where the guitar is the <em>lead voice</em> — soloing, carrying the melody, or occupying the space a horn solo would fill. Rhythm guitar, however foundational, is not the subject here.</p>\n<hr />\n<h2>Track-by-Track Commentary</h2>\n<h3>Part I: Psychedelic Soul + Early Funk (1969–1975)</h3>\n<p><strong>1. Cissy Strut — The Meters</strong> <em>(The Meters, 1969)</em></p>\n<p>Leo Nocentelli's opening statement for this playlist is a study in restraint. He plays almost nothing — but what he plays is perfectly placed. Listen for the single-note descending lick that punctuates the horn groove around the 0:45 mark: five notes, delivered with a slightly lazy attack that lands just behind the beat, creating the sensation that the whole track leans. This is the first principle of funk lead guitar: occupy exactly the space you need and not a note more. Nocentelli's guitar is in constant call-and-response with Art Neville's organ, and neither one steps on the other. For a musician with a chamber ensemble background, think of it as two voices in careful counterpoint — except the counterpoint is in service of a groove, not a voice-leading exercise.</p>\n<p><strong>2. Move On Up — Curtis Mayfield</strong> <em>(Keep on Keeping On: Curtis Mayfield Studio Albums 1970–1974, 2019 Remaster)</em></p>\n<p>Use the full 8:53 remaster, not the single edit. The reason is that Mayfield's guitar doesn't fully emerge until the piece has breathed for a few minutes. He plays a detuned open-E guitar (tuned down a half step) in a distinctively choppy, falsetto-like single-note style that directly mirrors his vocal register. Around the 3:00 mark, the horn section drops away and the guitar takes over the melodic lead — notice how the phrasing is identical to what his voice would do: short exclamations, space, another short exclamation, resolution. He is playing his own vocal part. The wah is subtle here, mostly used for tonal color rather than dramatic swells. This is the root of the \"guitar as voice\" tradition.</p>\n<p><strong>3. Maggot Brain — Funkadelic</strong> <em>(Maggot Brain, 1971)</em></p>\n<p>The centerpiece of this entire playlist. George Clinton allegedly told Eddie Hazel to \"play the first part like your mama just told you she's dying, and the second part like you found out it was a lie.\" The result is a ten-minute solo with no chord changes underneath — just a single root drone — that contains more emotional information per bar than most guitarists pack into a career. Harmonically, Hazel stays almost entirely in the minor pentatonic, but his use of vibrato (extremely wide, slow, and deliberate — closer to a violinist's than a rock guitarist's), his bend targets (he reaches for the major 3rd from below, landing somewhere between the minor and major third — the blue zone), and his phrasing arc (beginning sparse, building to overwhelming density, then retreating to silence) make this the definitive statement of the guitar-as-voice principle. This is Jimi Hendrix's psychedelic language translated into pure grief.</p>\n<p><strong>4. Strawberry Letter 23 — Shuggie Otis</strong> <em>(Freedom Flight, 1971)</em></p>\n<p>Before the Brothers Johnson covered this in 1977 and made it a pop hit, Shuggie Otis recorded the original at 17 years old in his home studio in Hollywood. His guitar here is layered and dreamy — he plays with a fingerpicked, almost harp-like delicacy that contrasts sharply with the Maggot Brain intensity preceding it. Listen for the descending melodic run around 0:30 that feels like it's slipping between the cracks of the rhythm — it's in the right time signature, but it floats above the grid. Shuggie was building toward something that wouldn't fully arrive until his 1974 masterpiece; the playing here is precocious and slightly impressionistic, pointing toward a future where funk guitar would absorb ambient and psychedelic textures.</p>\n<p><strong>5. That Lady, Pts. 1 &amp; 2 — The Isley Brothers</strong> <em>(3+3, 1973)</em></p>\n<p>Ernie Isley heard Jimi Hendrix in 1969 — Hendrix was briefly in the Isley Brothers' touring band before he became famous — and spent the next decade processing that encounter into something distinctly his own. \"That Lady\" is the arrival: the wah-soaked, sustain-drenched lead guitar that opens the track and runs through it entirely is the most explicitly \"singing\" lead guitar in the canon. Ernie plays in a call-and-response dialogue with the vocals — he fills the exact spaces between vocal phrases, then trades off when the vocals drop out. Notice that he almost never plays a lick exactly the same way twice; this is improvisational variation in real time, not riff repetition. For a violinist: the vibrato Ernie uses is actually bow-technique vibrato — arm-based, wide, and used for expressiveness rather than tuning correction. It transforms the guitar's natural sustain into something vocal.</p>\n<p><strong>6. Freddie's Dead — Curtis Mayfield</strong> <em>(Superfly, 1972)</em></p>\n<p>The wah guitar on \"Freddie's Dead\" is Mayfield's most overt use of the effect as a rhythmic tool rather than just a tone-shaper. He opens the song with the guitar playing the hook — not the vocals, the guitar — and the wah rocks in a consistent 16th-note pattern that is, functionally, a second percussive voice underneath the kit. But within that rhythmic framework, the melodic content of the hook is genuinely vocal: a phrase that rises a major 3rd, rests, then descends back through the minor pentatonic. The \"resting\" moment — the silence in bar 2 of the hook — is where the funk lives. Compare this to \"Move On Up\": both tracks show Mayfield treating the guitar as his lead voice, but here the arrangement is sparser, making his guitar's role more obviously primary.</p>\n<hr />\n<h3>Part II: Jazz-Funk Refinement (1974–1982)</h3>\n<p><strong>7. Inspiration Information — Shuggie Otis</strong> <em>(Inspiration Information/Wings of Love, 1974)</em></p>\n<p>The album Shuggie Otis made almost entirely alone in his home studio, building every part layer by layer. His guitar work here is more assured than on \"Strawberry Letter 23\" — the lead lines have a settled, unhurried quality, like he knows exactly what he wants to say and isn't in a hurry to say it. The track is proto-everything: you can hear elements of future ambient music, quiet storm R&amp;B, and even lo-fi in the production. The guitar melody in the opening section plays a minor pentatonic figure against a drum loop that Shuggie programmed himself. It is 1974; this approach would not be common for another twenty years. The lead tone is dry and warm, almost like an acoustic guitar with a touch of overdrive — completely different from the wah-heavy leads of his contemporaries.</p>\n<p><strong>8. Fight the Power, Pts. 1 &amp; 2 — The Isley Brothers</strong> <em>(The Heat Is On, 1975)</em></p>\n<p>Ernie Isley at full power. The guitar on \"Fight the Power\" is less about singing and more about raw energy — he plays the opening riff on the upbeat and lets it hang in the air before the bass enters. The solo section (around the 2:30 mark) is Ernie at his most Hendrix-indebted: bends that go a full step and a half, screaming high-register vibrato, phrases that start in one rhythmic grid and land in another. But what keeps it firmly in the funk tradition rather than the rock tradition is the way the solo interacts with the groove: he never abandons the pocket. Even at peak intensity, his phrases resolve on beat 1 or the \"and\" of 4 — always landing somewhere that reinforces the cycle.</p>\n<p><strong>9. Breezin' — George Benson</strong> <em>(Breezin', 1976)</em></p>\n<p>The commercial jazz-funk crossover, and a case study in how jazz guitar vocabulary sounds when placed in a groove context. Benson's tone is cleaner and rounder than anything in the first section — less wah, more pure pickup-through-clean-amp warmth — and his phrasing is from the bebop tradition: chromatic passing tones, ii-V resolutions, runs that outline chord tones before resolving. What makes this \"funk\" rather than pure jazz is the rhythmic placement: even his most bebop-inflected runs land on groove-friendly positions. Benson famously hums along with his guitar solos in unison, which creates a subtle chorus effect. As a violinist and a cappella arranger, you may find his pitch certainty striking — every bent note has a clear target, and he hits it.</p>\n<p><strong>10. Captain Fingers — Lee Ritenour</strong> <em>(Captain Fingers, 1977)</em></p>\n<p>The most technically demanding track in the first half of the playlist. Ritenour plays a chord-melody style that sits between lead guitar and comping — he voices chords high on the neck and leads with the top notes while filling in harmony underneath. The title track demonstrates his approach: a smooth, almost neo-classical legato style applied to funk-adjacent grooves. Listen to how he articulates the line around 1:30 — hammer-ons and pull-offs create a seamless legato that sounds more like a violin than a pick attack. For someone with a violin background, this phrasing logic will be immediately recognizable. As a guitar technique goal, the legato fluency Ritenour demonstrates here is a significant milestone: it requires left-hand independence that takes months to develop.</p>\n<p><strong>11. Street Life — The Crusaders</strong> <em>(Street Life, 1979)</em></p>\n<p>Larry Carlton's guitar solo on \"Street Life\" is arguably the most elegant funk-lead moment on this playlist. He enters around the 5:00 mark after Randy Crawford's vocal, and what he plays is a clinic in phrasing economy: eight-bar solo, maybe twelve distinct notes, absolutely no wasted motion. Every note lands with precise conviction on a rhythmically charged position — he targets the \"and\" of 2, holds it, then drops a descending phrase that resolves squarely on 1 of the next bar. The tone is a semi-hollow with light overdrive, giving just enough sustain for his signature bends to bloom. Carlton demonstrates that you do not need complexity to say something powerful; you need the right note in the right place. Carlton would go on to be one of the most-recorded session guitarists of the '80s, and this solo is the reason why.</p>\n<p><strong>12. One Nation Under a Groove — Funkadelic</strong> <em>(One Nation Under a Groove, 1978)</em></p>\n<p>By 1978, Funkadelic had moved from the psychedelic extremism of \"Maggot Brain\" toward something more ecstatic and communal. The guitar interplay here involves multiple players — primarily Garry Shider and Michael Hampton — trading and layering leads over an extended groove. Listen for the way the lead guitar functions like a horn section: punchy, rhythmically precise phrases that interlock with the bass and drums rather than hovering above them. The shift from Eddie Hazel's solo-voice approach to this more collective, percussion-integrated guitar language is significant. The funk has gotten deeper, and the guitar has learned to lock into the pocket rather than float above it.</p>\n<hr />\n<h3>Part III: The Prince Synthesis (1984–1986)</h3>\n<p><strong>13. Let's Go Crazy — Prince</strong> <em>(Purple Rain, 1984)</em></p>\n<p>Prince is one of the most underrated guitar players in rock and funk history, perpetually overshadowed by his own genius at songwriting, production, and performance. \"Let's Go Crazy\" is a showcase, and the guitar solo that closes the album version is a decisive statement: he starts in the blues-rock tradition, works through a phrase structure that acknowledges Hendrix, then accelerates into something percussive and almost frantic before landing on a sustained wail. What makes it \"Prince\" rather than just a generic blues-rock solo is the phrase architecture — he builds in miniature arcs, each one a question-and-answer pair, before connecting them into the larger statement. The tone is bright and slightly dirty, a strat-style pickup through what sounds like a light crunch — cutting, present, aggressive.</p>\n<p><strong>14. Purple Rain — Prince</strong> <em>(Purple Rain, 1984)</em></p>\n<p>The opposite emotional register from \"Let's Go Crazy.\" The \"Purple Rain\" guitar solo is one of the great sustained melodic statements in any genre — six minutes of song reaches its climax in a guitar voice that is recognizably human, recognizably grieving, and formally perfect. Prince uses wide vibrato (again, the arm-based violin style), controlled feedback, and slow bends that hang in the air before resolving. He never plays fast; he plays deliberately and inevitably. For someone with a violin background: the way Prince manages long tones here — adding vibrato late after the initial attack, controlling the rate of oscillation — is exactly correct bow technique translated to guitar. The note speaks first, then the vibrato gives it voice. Compared to \"Maggot Brain,\" the psychedelic chaos has been replaced with formal control. This is the blues ballad tradition meeting the gospel tradition meeting the singer-songwriter tradition, unified by a guitarist who learned from all of them.</p>\n<p><strong>15. Crazay — Jesse Johnson feat. Sly Stone</strong> <em>(Shockadelica, 1986)</em></p>\n<p>Jesse Johnson was Prince's rhythm guitarist in The Time, and \"Crazay\" is his attempt to claim the funk lead guitar throne in his own right. The guitar tone is cleaner and more envelope-filtered than Prince's — listen for the auto-wah effect that shapes the attack of each note, giving phrases a percussive \"quack\" character. Johnson's leads are tighter and more rhythmically precise than Prince's, less given to extended lyricism, more interested in interlocking with the groove. The track features Sly Stone on vocals, which is a direct lineage signal: Johnson understands that he's working in the tradition of Sly &amp; the Family Stone's guitarists, and he's updating it with mid-'80s production. The bridge section around 2:00 features a guitar break where Johnson plays entirely through an envelope filter with no other effect — this is the clearest demonstration in the playlist of what the auto-wah does to articulation.</p>\n<hr />\n<h3>Part IV: The Neo-Soul Bridge (1997–2000)</h3>\n<p><strong>16. A Go Go — John Scofield</strong> <em>(A Go Go, 1997)</em></p>\n<p>The moment where jazz guitar and funk merged completely, with Medeski Martin &amp; Wood providing the swampy, organ-trio backdrop. Scofield has always played with a slightly gritty, twangy tone (he uses a lot of pick noise intentionally), and on \"A Go Go\" that rawness serves the funk perfectly. His phrasing is jazz-derived — motivic development, chromatic approach notes, phrase answers that turn back on themselves — but the time feel is deep-pocket funk. Listen for how he plays <em>behind</em> the beat: where Ernie Isley plays on or slightly ahead of the beat for intensity, Scofield pulls back, creating a loping, relaxed feel that is its own kind of authority. This album is one of the great crossover records in jazz-funk history, and this title track is its thesis statement.</p>\n<p><strong>17. Chicken Grease — D'Angelo</strong> <em>(Voodoo, 2000)</em></p>\n<p>The <em>Voodoo</em> album is one of the great funk records of the 21st century, a deliberate reclamation of the organic, live-feeling funk of Sly Stone and Parliament-Funkadelic from the synthesizer-dominated '80s and '90s. \"Chicken Grease\" is its most guitar-forward track: a hypnotic, repeated vamp with a wah-filtered single-note guitar hook that is as much rhythm as it is melody. The recording credit for guitar varies depending on the source, but the playing is clearly indebted to Ernie Isley and the Isley Brothers tradition — the same percussive wah articulation, the same call-and-response logic with the bass. Where \"Maggot Brain\" extended the guitar into pure expression, \"Chicken Grease\" brings it back to the pocket. This is the document that told a generation of neo-soul musicians that organic funk was still the most powerful thing in the room.</p>\n<hr />\n<h3>Part V: The Modern Renaissance (2012–2018)</h3>\n<p><strong>18. Nakamarra — Hiatus Kaiyote feat. Q-Tip</strong> <em>(Tawk Tomahawk, 2012)</em></p>\n<p>Melbourne's Hiatus Kaiyote, led by singer-guitarist Nai Palm, arrived in 2012 as something genuinely new: a band that synthesized neo-soul, jazz harmony, and progressive composition through a deeply funky rhythmic sensibility. Nai Palm's guitar playing is explicitly anti-pattern — she resists the convention of \"play the pentatonic box\" and instead moves harmonically, using major 7th chord voicings in a way that's closer to jazz guitar than funk. But the rhythmic feel of her lead phrasing is pure pocket. Listen for her guitar figure at 1:15 — it's a descending line built from the major scale over a minor chord, creating a Dorian tonality, but it arrives with the attack and precision of a funk lead. The Q-Tip feature deepens the connection to hip-hop's sampling of funk vocabulary. If you are a theory person: the harmonic language Nai Palm uses is the Dorian mode applied to funk, which is the jazz-blues synthesis that makes neo-soul distinct from either genre alone.</p>\n<p><strong>19. Shofukan — Snarky Puppy</strong> <em>(We Like It Here, 2014)</em></p>\n<p>Snarky Puppy is a collective, and \"Shofukan\" is a demonstration of what happens when you put multiple world-class funk and jazz players in a room and let them develop a groove over seven minutes. The guitar work — primarily Bob Lanzetti — sits in the pocket for most of the track before breaking into lead territory around the 3:30 mark. What's notable is how the lead guitar enters the conversation: it doesn't take over, it joins. The phrasing is in dialogue with the keyboard and the horn line simultaneously, creating a three-way call-and-response. This is the collective approach to funk guitar lead, evolved from Funkadelic's later multi-guitar approach, updated with the compositional rigor of the modern jazz scene. The time feel throughout is extraordinarily precise — these musicians are playing exactly in the groove, not approximating it.</p>\n<p><strong>20. The Force — Lettuce</strong> <em>(Crush, 2015)</em></p>\n<p>Lettuce is the jam-scene inheritor of the Meters' and Meters-adjacent tradition: a rhythm-section-forward band where the guitar (Adam Smirnoff) is in service of the groove rather than floating above it. \"The Force\" is Lettuce at their most economical: a single repeated figure that evolves through the track with slight variations. Smirnoff's lead tone is cleaner and brighter than the vintage players — he's working with modern pickups through a cleaner amp chain — but his rhythmic placement is firmly in the Nocentelli tradition. Listen for the moments where he breaks from the figure into a brief melodic statement: they happen exactly where you'd expect a horn player to breathe, and they resolve exactly where you'd expect a phrase to land. This is learned, cultivated, deliberately historical vocabulary.</p>\n<p><strong>21. Come Down — Anderson .Paak</strong> <em>(Malibu, 2016)</em></p>\n<p>The guitar on \"Come Down\" is primarily Jeff Gitelman (Paak's key collaborator on <em>Malibu</em>), and it demonstrates how the funk lead tradition has been absorbed into contemporary R&amp;B production without being credited. The wah-filtered guitar figure that runs through the track is straight out of the Curtis Mayfield playbook — rhythmically identical to the pattern on \"Freddie's Dead\" — but the production context is hip-hop influenced, with sampler-style drum programming underneath. Listen for how the guitar becomes more aggressive in the chorus: the filter opens wider, the attack gets harder, and the phrase lands more decisively on the downbeat. Anderson .Paak bridges James Brown's funk, Prince's eclecticism, and modern trap production in a single track, and the guitar is the element that connects him most directly to the historical lineage.</p>\n<p><strong>22. Disco Yes — Tom Misch feat. Poppy Ajudha</strong> <em>(Geography, 2018)</em></p>\n<p>Tom Misch emerged from South London's jazz-influenced bedroom-production scene, and \"Disco Yes\" is his clearest statement of funk guitar as melodic voice. His playing is clean and warm, indebted to George Benson's jazz-funk vocabulary but inflected with the understated aesthetic of the contemporary electronic-adjacent scene. The guitar solo around 2:00 is the track's emotional peak: a smooth, legato line in the minor pentatonic that borrows from the jazz guitar tradition without quoting it directly. Misch's phrasing is more patient than most of his contemporaries — he sets up phrases with space, allows them to breathe, and resolves them without rushing. For a listener coming from the jazz tradition, this will feel familiar; for someone approaching from the funk side, it represents the most refined and least percussive point on the spectrum.</p>\n<p><strong>23. Swagism — Ghost-Note feat. Nigel Hall</strong> <em>(Swagism, 2018)</em></p>\n<p>Ghost-Note, led by drummer Robert \"Sput\" Searight and percussionist Nate Werth (both of Snarky Puppy), is perhaps the most hardcore funk outfit of the current era. \"Swagism\" is the one track on this playlist where you can hear the entire history played forward simultaneously: the wah-envelope filter lead guitar is in direct dialogue with the Meters and Funkadelic tradition, the production is modern and crisp, and Nigel Hall's vocal is pure soul. The guitar work (primarily Cody Blackbird in the Ghost-Note live setup) is aggressive and rhythmically tight — less lyricism, more percussion. This is where funk guitar lead arrives in the present: it has reabsorbed the historical vocabulary, filtered it through contemporary production, and arrived at something that is recognizably connected to \"Cissy Strut\" and \"Maggot Brain\" while sounding completely contemporary.</p>\n<hr />\n<h2>What to Listen For Across the Whole Arc</h2>\n<ul>\n<li>\n<p><strong>The wah pedal as vowel generator.</strong> Track how the wah transitions from a stylistic choice in 1969 (Nocentelli barely uses it) to a primary articulation tool (Mayfield, Isley, Hazel) to a taken-for-granted color (Scofield's gritty tone, modern envelope filters). The effect is the same across six decades; only the subtlety of its application changes.</p>\n</li>\n<li>\n<p><strong>The silence between phrases.</strong> Every guitarist in this playlist uses rests as structural elements, not empty space. Try counting the beats of silence between Hazel's phrases in \"Maggot Brain\" — they're as carefully placed as the notes. When you reach the modern tracks, notice that the same logic applies: Tom Misch's patience, Mark Lettieri's economy.</p>\n</li>\n<li>\n<p><strong>The arc from maximalism to economy.</strong> The playlist moves from Hazel's ten-minute psychedelic solo toward Carlton's twelve-note statement on \"Street Life.\" This is not a decline; it's the tradition learning to say more with less. Prince synthesizes both extremes — maximalism when needed, restraint when called for.</p>\n</li>\n<li>\n<p><strong>Call-and-response geography.</strong> Listen for how each guitarist positions their phrases relative to the other instruments. In the early tracks, the guitar responds to the horn section. By the middle of the playlist, the guitar <em>is</em> the horn section. By the modern tracks (Snarky Puppy, Ghost-Note), the guitar is part of a conversation that involves keyboard, percussion, and production elements simultaneously.</p>\n</li>\n<li>\n<p><strong>Vibrato as vocabulary.</strong> Wide, slow vibrato (Hazel, Ernie Isley, Prince) signals emotional intensity and is drawn from the blues and gospel traditions. Narrow, quick vibrato (Benson, Ritenour, Scofield) signals jazz refinement. Nai Palm uses almost no vibrato — her expressiveness comes from harmonic choice instead. The vibrato an artist chooses tells you exactly where they're coming from.</p>\n</li>\n</ul>"}];

function showIndex() {
    document.getElementById('index-view').style.display = 'block';
    document.getElementById('detail-view').style.display = 'none';
    document.title = 'Guitar Playlist Library';
}

function showDetail(id) {
    const p = playlists.find(x => x.id === id);
    if (!p) return;
    document.getElementById('index-view').style.display = 'none';
    const dv = document.getElementById('detail-view');
    dv.style.display = 'block';

    const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    const tagPills = tags.map(t => `<span class="pill">${t}</span>`).join('');
    const spotifyBtn = p.spotify_url
        ? `<a class="spotify-btn" href="${p.spotify_url}" target="_blank">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
               <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
             </svg>
             Open in Spotify
           </a>`
        : '';

    dv.innerHTML = `
        <button class="back-btn" onclick="showIndex()">← All Playlists</button>
        <div class="detail-meta">${tagPills}</div>
        ${spotifyBtn}
        <div id="detail-body">${p.html_body}</div>
    `;
    document.title = p.title || 'Playlist';
    window.scrollTo(0, 0);
}

function renderIndex() {
    const grid = document.getElementById('playlist-grid');
    grid.innerHTML = playlists.map(p => {
        const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 4);
        const tagPills = tags.map(t => `<span class="pill">${t}</span>`).join('');
        return `
        <div class="card" onclick="showDetail('${p.id}')">
            <div class="card-title">${p.title || p.id}</div>
            <div class="card-angle">${p.angle || ''}</div>
            <div class="card-meta">${tagPills}<span class="pill green">${p.track_count || '?'} tracks</span></div>
            <div class="card-artists">${p.featured_artists || ''}</div>
            <div class="card-date">${p.created || ''}</div>
        </div>`;
    }).join('');
}

renderIndex();
</script>
